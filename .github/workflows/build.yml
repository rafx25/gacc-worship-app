name: Build

# Push to master: build the Windows installers and keep them as a downloadable artifact.
# Push a tag like v1.3.6: build and publish them as a GitHub Release.
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run dist -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: GACC-Worship-windows
          path: dist/*.exe
          retention-days: 14

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
